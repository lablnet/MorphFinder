appId: com.lablnet.morphfinder
productName: MorphFinder
copyright: Copyright © 2026 Lablnet
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
asarUnpack:
  - "**/*.node"
publish:
  provider: github
  owner: lablnet
  repo: MorphFinder
  releaseType: release
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: native/macos/MorphNative.node
      to: MorphNative.node
mas:
  category: public.app-category.utilities
  provisioningProfile: build/MorphFinder_Mac_App_Store_Distribution.provisionprofile
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.plist
  extraResources:
    - from: native/macos/MorphNative.node
      to: MorphNative.node
win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: native/windows-linux/MorphNative.node
      to: MorphNative.node
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  category: Utility
  extraResources:
    - from: native/windows-linux/MorphNative.node
      to: MorphNative.node
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
