appId: net.lablnet.MorphFinder
productName: MorphFinder
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
asarUnpack:
  - "**/*.node"
publish:
  provider: github
  owner: lablnet
  repo: MorphFinder
  releaseType: release
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: native/macos/MorphNative.node
      to: MorphNative.node
win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: native/windows-linux/MorphNative.node
      to: MorphNative.node
  signingHashAlgorithms: [sha256]
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  category: Utility
  extraResources:
    - from: native/windows-linux/MorphNative.node
      to: MorphNative.node
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
