name: Build & Bundle Size Analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-size:
    name: Measure Bundle & App Build Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Build Application
        run: pnpm build

      - name: Report Output Bundle Sizes
        run: |
          echo "=== Built Output Directories ==="
          du -sh out/*
          echo "=== Renderer Bundle Breakdown ==="
          ls -lh out/renderer/assets/
