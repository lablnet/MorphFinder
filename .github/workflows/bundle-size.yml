name: Build & Bundle Size Analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-size:
    name: Measure Bundle & App Build Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe3f64c67699419142ec90795c65f02f90117079 # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c38000445c58f66933956158 # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build

      - name: Report Output Bundle Sizes
        run: |
          echo "=== Built Output Directories ==="
          du -sh out/*
          echo "=== Renderer Bundle Breakdown ==="
          ls -lh out/renderer/assets/
