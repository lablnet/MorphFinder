name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      - name: Build native macOS module
        if: runner.os == 'macOS'
        run: pnpm native:build

      - name: Native Module Tests (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:native

      - name: Build app
        run: pnpm build

      - name: Playwright Smoke Tests
        if: runner.os != 'Linux'
        run: pnpm playwright test

      - name: Playwright Smoke Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm playwright test

