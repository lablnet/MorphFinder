name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      - name: Build native macOS module
        if: runner.os == 'macOS'
        run: pnpm native:build

      - name: Native Module Tests (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:native

      - name: Build app
        run: pnpm build

      - name: Playwright Smoke Tests
        if: runner.os != 'Linux'
        run: pnpm playwright test

      - name: Playwright Smoke Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm playwright test
