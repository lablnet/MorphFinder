name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.168.0

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          semgrep scan --config p/default --sarif --output semgrep.sarif --error
          scan_status=$?
          semgrep scan --config p/default --json --output semgrep.json
          echo "exit_code=${scan_status}" >> "$GITHUB_OUTPUT"
          exit "${scan_status}"

      - name: Upload SARIF report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore

      - name: Summarize Semgrep report
        if: always()
        run: |
          {
            echo "## Semgrep"
            echo
            if [ -f semgrep.json ]; then
              echo "Semgrep completed with exit code: ${{ steps.semgrep.outputs.exit_code }}"
              echo
              echo "Semgrep findings are reported as artifacts and SARIF, but this workflow only fails for high-or-higher pnpm audit vulnerabilities."
            else
              echo "Semgrep report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          install: "false"

      - name: Run pnpm audit
        id: pnpm-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high --json > pnpm-audit.json
          audit_status=$?
          echo "exit_code=${audit_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize pnpm audit
        id: summarize-pnpm-audit
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const outputPath = process.env.GITHUB_OUTPUT;
          const reportPath = 'pnpm-audit.json';
          const status = process.env.AUDIT_EXIT_CODE || '1';

          const write = (content) => fs.appendFileSync(summaryPath, content);
          const setOutput = (name, value) => fs.appendFileSync(outputPath, `${name}=${value}\n`);
          write('## pnpm audit\n\n');

          if (!fs.existsSync(reportPath)) {
            write('pnpm audit did not produce a JSON report.\n');
            setOutput('high_or_worse_count', '0');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const advisories = [
            ...Object.values(report.advisories || {}),
            ...Object.values(report.vulnerabilities || {}),
          ];
          const highOrWorse = advisories.filter((advisory) => {
            const severity = String(advisory.severity || '').toLowerCase();
            return severity === 'high' || severity === 'critical';
          });
          setOutput('high_or_worse_count', String(highOrWorse.length));

          write(`Audit exit code: ${status}\n\n`);
          write(`High-or-higher vulnerabilities: ${highOrWorse.length}\n\n`);

          if (highOrWorse.length === 0) {
            write('No high-or-higher pnpm audit vulnerabilities were found.\n');
            process.exit(0);
          }

          write('| Severity | Package | Title |\n');
          write('| --- | --- | --- |\n');
          for (const advisory of highOrWorse) {
            const severity = advisory.severity || 'unknown';
            const moduleName = advisory.module_name || advisory.name || 'unknown';
            const title = String(advisory.title || advisory.overview || 'Untitled').replace(/\|/g, '\\|');
            write(`| ${severity} | ${moduleName} | ${title} |\n`);
          }
          NODE
        env:
          AUDIT_EXIT_CODE: ${{ steps.pnpm-audit.outputs.exit_code }}

      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error

      - name: Fail on high pnpm audit vulnerabilities
        if: always() && steps.summarize-pnpm-audit.outputs.high_or_worse_count != '0'
        run: exit 1
