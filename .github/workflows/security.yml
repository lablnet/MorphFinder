name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.168.0

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          semgrep scan --config p/default --sarif --output semgrep.sarif --error
          scan_status=$?
          semgrep scan --config p/default --json --output semgrep.json
          echo "exit_code=${scan_status}" >> "$GITHUB_OUTPUT"
          exit "${scan_status}"

      - name: Upload SARIF report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore

      - name: Fail on Semgrep findings
        if: always() && steps.semgrep.outputs.exit_code != '0'
        run: exit 1

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fe3f64c67699419142ec90795c65f02f90117079 # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c38000445c58f66933956158 # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Run pnpm audit
        run: pnpm audit --audit-level high
