name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build native macOS module
        if: runner.os == 'macOS'
        run: pnpm native:build

      - name: Test native macOS module
        if: runner.os == 'macOS'
        run: pnpm test:native

      - name: Build app
        run: pnpm build

      - name: Playwright smoke tests
        if: runner.os != 'Linux'
        run: pnpm playwright test

      - name: Playwright smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm playwright test
