[package]
name = "morph_native_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
md5 = "0.7"
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell"
] }

[build-dependencies]
napi-build = "2"
