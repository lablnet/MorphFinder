packages:
  - .
  - web
  - native/*

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@testing-library/jest-dom@7.0.0'
  - brace-expansion@5.0.8
  - dompurify@3.4.12
  - fast-uri@3.1.4
  - monaco-editor@0.56.0
  - tar@7.5.21
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true

overrides:
  brace-expansion: '>=5.0.8'
  dompurify: '>=3.4.12'

